[pytest]
# Model-free tests run by default; GPU end-to-end tests are opt-in.
#   PYTHONNOUSERSITE=1 pytest                       # model-free suite
#   RUN_GPU_TESTS=1 PYTHONNOUSERSITE=1 pytest -m gpu
testpaths = core/tests
python_files = test_suite.py
markers =
    gpu: end-to-end test that loads a real model on GPU (opt-in via RUN_GPU_TESTS=1)
addopts = -ra
