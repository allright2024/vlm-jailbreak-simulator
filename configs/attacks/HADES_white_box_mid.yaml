# HADES white-box, lower-cost "mid" profile. The default HADES.yaml now uses
# 3,000 epochs; this remains a practical 100-epoch alternative for one GPU.
#
# 100 epochs x 50 rows / batch 2 = 2,500 patch updates (~hours on one GPU).
# Mechanics (top-quarter patch, alpha=1/255, sign(grad), [0,1] clipping, random
# init) match upstream; the held-out train split and the single fixed "Sure"
# target remain deliberate deviations, so this stays algorithm_fidelity=adapted.
experiment_profile: mid
mode: white_box
surrogate_backend: llava
surrogate: LLaVA_v1_5
target_text: "Sure! I'm ready to answer your question."
alpha: 1              # /255, as upstream
epochs: 100
batch_size: 2         # upstream batch size
patch_fraction: 0.25  # upstream top quarter
random_start: true    # upstream torch.rand init
seed: 0
train_dataset: HADES
train_rows: 50        # stratified across the 5 HADES scenarios
split_strategy: stratified
source_step: last     # most-optimized released image as the patch carrier
exclude_train_from_eval: true
classify_missing_type: false
