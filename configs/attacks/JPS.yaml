# JPS (ACM MM 2025). Co-optimizes a visual PGD perturbation (Qwen2-VL surrogate)
# and a multi-agent textual steer prompt. Substitutions (documented): the agent
# LLM is an OpenAI model (paper: local Qwen2.5-14B); the PGD reuses this repo's
# Qwen2-VL adapter. The steer prompt is prepended to each query at attack time.
experiment_profile: official   # uses the paper's PGD steps / rounds / momentum
surrogate: Qwen/Qwen2-VL-7B-Instruct
surrogate_revision: eed13092ef92e448dd6875b2a00151bd3f7db0ac
agent_model: gpt-4o-2024-11-20
base_image: data/UltraBreak/images/white.jpeg
train_dataset: AdvBench      # use train_csv for the official advbench_subset.csv
# train_csv: /path/to/advbench_subset.csv
attack_data_num: 50
exclude_train_from_eval: true
image_size: 448
epsilon: "32/255"
alpha: "1/255"
attack_steps: 300
rounds: 5                    # revision_iteration_num
momentum_decay: 0.9
